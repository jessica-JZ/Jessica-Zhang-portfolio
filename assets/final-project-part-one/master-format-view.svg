<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">A substantial share of identifiable masters also had a Vinyl version</title>
<desc id="desc">A paired-dot comparison shows the percentage of identifiable masters represented by a 2024 File or Vinyl release version.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#252525}.title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#555}.label{font-size:17px}.small{font-size:14px;fill:#666}.style{font-size:21px;font-weight:700}.grid{stroke:#ddd9d0;stroke-width:1}.axis{stroke:#918d84;stroke-width:1.5}.noteBox{fill:#fff8dc;stroke:#d6bc55;stroke-width:1.5}</style>
<text x="70" y="58" class="title" style="font-size:28px">Many identifiable works also had a Vinyl version</text>
<text x="70" y="91" class="subtitle">Masters represented by a filtered 2024 release version; formats can overlap</text>
<line x1="250.0" y1="150" x2="250.0" y2="515" class="grid"/>
<text x="250.0" y="540" text-anchor="middle" class="small">0%</text>
<line x1="462.5" y1="150" x2="462.5" y2="515" class="grid"/>
<text x="462.5" y="540" text-anchor="middle" class="small">25%</text>
<line x1="675.0" y1="150" x2="675.0" y2="515" class="grid"/>
<text x="675.0" y="540" text-anchor="middle" class="small">50%</text>
<line x1="887.5" y1="150" x2="887.5" y2="515" class="grid"/>
<text x="887.5" y="540" text-anchor="middle" class="small">75%</text>
<line x1="1100.0" y1="150" x2="1100.0" y2="515" class="grid"/>
<text x="1100.0" y="540" text-anchor="middle" class="small">100%</text>
<text x="70" y="216" class="style">House</text>
<line x1="675.5" y1="210" x2="796.4" y2="210" stroke="#d8d4cb" stroke-width="5"/>
<circle cx="675.5" cy="210" r="10" fill="#7656A8"/>
<circle cx="796.4" cy="210" r="10" fill="#C56D2D"/>
<text x="675.5" y="192" text-anchor="middle" class="label">Vinyl 50.1%</text>
<text x="796.4" y="192" text-anchor="middle" class="label">File 64.3%</text>
<text x="70" y="346" class="style">Techno</text>
<line x1="729.0" y1="340" x2="885.6" y2="340" stroke="#d8d4cb" stroke-width="5"/>
<circle cx="729.0" cy="340" r="10" fill="#7656A8"/>
<circle cx="885.6" cy="340" r="10" fill="#C56D2D"/>
<text x="729.0" y="322" text-anchor="middle" class="label">Vinyl 56.4%</text>
<text x="885.6" y="322" text-anchor="middle" class="label">File 74.8%</text>
<text x="70" y="476" class="style">Ambient</text>
<line x1="586.6" y1="470" x2="803.2" y2="470" stroke="#d8d4cb" stroke-width="5"/>
<circle cx="586.6" cy="470" r="10" fill="#7656A8"/>
<circle cx="803.2" cy="470" r="10" fill="#C56D2D"/>
<text x="586.6" y="452" text-anchor="middle" class="label">Vinyl 39.6%</text>
<text x="803.2" y="452" text-anchor="middle" class="label">File 65.1%</text>
<rect x="70" y="575" width="1060" height="78" rx="8" class="noteBox"/>
<text x="92" y="606" class="label">This is a second unit of analysis, not a replacement for the release-version chart.</text>
<text x="92" y="633" class="small">Only records with a usable master ID are included. One master may have both File and Vinyl versions.</text>
</svg>