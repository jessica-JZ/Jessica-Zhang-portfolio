<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">File led the selected release-version categories in 2022–2024</title>
<desc id="desc">A paired-dot comparison shows pooled File and Vinyl percentages for House, Techno, and Ambient, with a coverage warning for Ambient.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#252525}.title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#555}.label{font-size:17px}.small{font-size:14px;fill:#666}.style{font-size:21px;font-weight:700}.grid{stroke:#ddd9d0;stroke-width:1}.axis{stroke:#918d84;stroke-width:1.5}.noteBox{fill:#fff8dc;stroke:#d6bc55;stroke-width:1.5}</style>
<text x="70" y="58" class="title" style="font-size:29px">Across 2022–2024, File led in all three styles</text>
<text x="70" y="91" class="subtitle">Pooled percentage of filtered Discogs release versions that include each format</text>
<line x1="235.0" y1="150" x2="235.0" y2="525" class="grid"/>
<text x="235.0" y="548" text-anchor="middle" class="small">0%</text>
<line x1="451.2" y1="150" x2="451.2" y2="525" class="grid"/>
<text x="451.2" y="548" text-anchor="middle" class="small">25%</text>
<line x1="667.5" y1="150" x2="667.5" y2="525" class="grid"/>
<text x="667.5" y="548" text-anchor="middle" class="small">50%</text>
<line x1="883.8" y1="150" x2="883.8" y2="525" class="grid"/>
<text x="883.8" y="548" text-anchor="middle" class="small">75%</text>
<line x1="1100.0" y1="150" x2="1100.0" y2="525" class="grid"/>
<text x="1100.0" y="548" text-anchor="middle" class="small">100%</text>
<text x="70" y="216" class="style">House</text>
<line x1="452.3" y1="210" x2="860.9" y2="210" stroke="#d8d4cb" stroke-width="5"/>
<circle cx="452.3" cy="210" r="10" fill="#7656A8"/>
<circle cx="860.9" cy="210" r="10" fill="#C56D2D"/>
<text x="452.3" y="192" text-anchor="middle" class="label" fill="#7656A8">Vinyl 25.1%</text>
<text x="860.9" y="192" text-anchor="middle" class="label" fill="#C56D2D">File 72.4%</text>
<text x="70" y="351" class="style">Techno</text>
<line x1="431.2" y1="345" x2="885.7" y2="345" stroke="#d8d4cb" stroke-width="5"/>
<circle cx="431.2" cy="345" r="10" fill="#7656A8"/>
<circle cx="885.7" cy="345" r="10" fill="#C56D2D"/>
<text x="431.2" y="327" text-anchor="middle" class="label" fill="#7656A8">Vinyl 22.7%</text>
<text x="885.7" y="327" text-anchor="middle" class="label" fill="#C56D2D">File 75.2%</text>
<text x="70" y="486" class="style">Ambient</text>
<line x1="406.6" y1="480" x2="838.9" y2="480" stroke="#d8d4cb" stroke-width="5"/>
<circle cx="406.6" cy="480" r="10" fill="#7656A8"/>
<circle cx="838.9" cy="480" r="10" fill="#C56D2D"/>
<text x="406.6" y="462" text-anchor="middle" class="label" fill="#7656A8">Vinyl 19.8%</text>
<text x="838.9" y="462" text-anchor="middle" class="label" fill="#C56D2D">File 69.8%</text>
<rect x="70" y="575" width="1060" height="78" rx="8" class="noteBox"/>
<text x="92" y="605" class="label">Scope warning: Vinyl, CD, or File cover 76.9% of 2024 Ambient records;</text>
<text x="92" y="632" class="small">Cassette alone appears on 13.3%. This is not a complete account of Ambient’s physical-format history.</text>
</svg>