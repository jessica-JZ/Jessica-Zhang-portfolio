<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Initial storyboard for an electronic music format data story</title>
  <desc id="desc">Four stacked wireframe panels show the opening question with a format timeline, paired share and release-count charts, small multiples comparing three electronic styles, and a conclusion with limitations.</desc>
  <style>
    .bg{fill:#f7f5f0}.panel{fill:#fff;stroke:#c9c5bb;stroke-width:2}.ink{fill:#252525}.muted{fill:#666}.line{fill:none;stroke:#7656a8;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.line2{fill:none;stroke:#c56d2d;stroke-width:7}.grid{stroke:#ddd9d0;stroke-width:2}.axis{stroke:#918d84;stroke-width:2}.label{font-family:Arial,sans-serif;font-size:23px}.small{font-family:Arial,sans-serif;font-size:19px}.tiny{font-family:Arial,sans-serif;font-size:15px}.head{font-family:Georgia,serif;font-size:44px;font-weight:bold}.sub{font-family:Georgia,serif;font-size:29px}.note{fill:#fff8dc;stroke:#d6bc55;stroke-width:2}.vinyl{fill:#7656a8}.cd{fill:#6f91a8}.file{fill:#c56d2d}
  </style>
  <rect class="bg" width="1200" height="1500"/>
  <text x="70" y="70" class="head ink">Initial story sketch</text>
  <text x="70" y="110" class="label muted">Layout and chart roles only — placeholder lines are not findings</text>

  <rect x="60" y="150" width="1080" height="260" rx="12" class="panel"/>
  <text x="95" y="205" class="small muted">1 · OPENING QUESTION</text>
  <text x="95" y="270" class="head ink">Files took over. Vinyl remained.</text>
  <text x="95" y="315" class="sub ink">Three styles followed different paths.</text>
  <text x="95" y="360" class="label muted">Release format is not recording technology.</text>
  <circle cx="920" cy="280" r="82" fill="#2c2c2c"/>
  <circle cx="920" cy="280" r="27" fill="#f7f5f0"/>
  <circle cx="920" cy="280" r="8" fill="#7656a8"/>
  <text x="690" y="374" class="tiny muted">FORMAT TIMELINE</text>
  <line x1="690" y1="390" x2="1070" y2="390" class="axis"/>
  <circle cx="700" cy="390" r="6" fill="#7656a8"/><circle cx="880" cy="390" r="6" fill="#c56d2d"/><circle cx="1060" cy="390" r="6" fill="#918d84"/>
  <text x="700" y="402" text-anchor="middle" class="tiny muted">1985: Vinyl + CD</text><text x="880" y="402" text-anchor="middle" class="tiny muted">1993: first File</text><text x="1060" y="402" text-anchor="middle" class="tiny muted">2024</text>

  <rect x="60" y="445" width="1080" height="350" rx="12" class="panel"/>
  <text x="95" y="500" class="small muted">2 · THE FORMAT MIX CHANGES</text>
  <text x="95" y="545" class="sub ink">Share of cataloged releases by format</text>
  <text x="120" y="570" class="tiny muted">Share of selected releases</text>
  <line x1="120" y1="590" x2="120" y2="710" class="axis"/>
  <line x1="120" y1="710" x2="800" y2="710" class="axis"/>
  <line x1="120" y1="710" x2="800" y2="710" class="grid"/>
  <line x1="120" y1="650" x2="800" y2="650" class="grid"/>
  <line x1="120" y1="590" x2="800" y2="590" class="grid"/>
  <path d="M120 605 C260 620 360 655 470 670 S650 675 800 665" fill="none" stroke="#7656a8" stroke-width="7"/>
  <path d="M120 688 C260 665 360 620 470 635 S650 678 800 696" fill="none" stroke="#6f91a8" stroke-width="7"/>
  <path d="M120 710 C260 710 360 698 470 660 S650 610 800 596" fill="none" stroke="#c56d2d" stroke-width="7"/>
  <text x="100" y="716" text-anchor="end" class="tiny muted">0%</text>
  <text x="100" y="656" text-anchor="end" class="tiny muted">50%</text>
  <text x="100" y="596" text-anchor="end" class="tiny muted">100%</text>
  <text x="120" y="744" class="small muted">1985</text><text x="745" y="744" class="small muted">2024</text>
  <text x="460" y="774" text-anchor="middle" class="tiny muted">Release year</text>
  <text x="850" y="570" class="tiny muted">Total cataloged releases</text>
  <rect x="850" y="590" width="190" height="120" fill="#fafafa" stroke="#ddd9d0"/>
  <line x1="870" y1="690" x2="1020" y2="690" class="axis"/>
  <line x1="870" y1="610" x2="870" y2="690" class="axis"/>
  <path d="M870 680 C910 675 930 655 955 640 S990 615 1020 605" fill="none" stroke="#918d84" stroke-width="5"/>
  <text x="870" y="730" class="tiny muted">1985</text><text x="985" y="730" class="tiny muted">2024</text>
  <rect x="760" y="470" width="20" height="20" fill="#7656a8"/><text x="790" y="487" class="small ink">Vinyl</text>
  <rect x="870" y="470" width="20" height="20" fill="#6f91a8"/><text x="900" y="487" class="small ink">CD</text>
  <rect x="960" y="470" width="20" height="20" fill="#c56d2d"/><text x="990" y="487" class="small ink">File</text>

  <rect x="60" y="830" width="1080" height="370" rx="12" class="panel"/>
  <text x="95" y="885" class="small muted">3 · STYLES MAY DIFFER</text>
  <text x="95" y="930" class="sub ink">Percentage of releases tagged Vinyl</text>
  <g transform="translate(105 980)">
    <rect width="300" height="150" fill="#fafafa" stroke="#ddd9d0"/><text x="12" y="30" class="small ink">House</text><text x="4" y="54" class="tiny muted">100%</text><text x="15" y="132" class="tiny muted">0%</text><text x="45" y="146" class="tiny muted">1985</text><text x="245" y="146" class="tiny muted">2024</text><path d="M45 120 C100 100 170 55 280 70" class="line"/>
  </g>
  <g transform="translate(450 980)">
    <rect width="300" height="150" fill="#fafafa" stroke="#ddd9d0"/><text x="12" y="30" class="small ink">Techno</text><text x="4" y="54" class="tiny muted">100%</text><text x="15" y="132" class="tiny muted">0%</text><text x="45" y="146" class="tiny muted">1985</text><text x="245" y="146" class="tiny muted">2024</text><path d="M45 125 C100 80 175 105 280 45" class="line"/>
  </g>
  <g transform="translate(795 980)">
    <rect width="300" height="150" fill="#fafafa" stroke="#ddd9d0"/><text x="12" y="30" class="small ink">Ambient</text><text x="4" y="54" class="tiny muted">100%</text><text x="15" y="132" class="tiny muted">0%</text><text x="45" y="146" class="tiny muted">1985</text><text x="245" y="146" class="tiny muted">2024</text><path d="M45 80 C110 110 185 65 280 95" class="line"/>
  </g>
  <text x="105" y="1170" class="small muted">Same scale and date range in all three panels</text>

  <rect x="60" y="1235" width="1080" height="210" rx="12" class="panel"/>
  <text x="95" y="1290" class="small muted">4 · CONCLUSION AND LIMIT</text>
  <text x="95" y="1335" class="sub ink">A format shift, not a production story.</text>
  <rect x="95" y="1365" width="970" height="52" rx="7" class="note"/>
  <text x="115" y="1398" class="small ink">Discogs does not reveal whether a vinyl release used an analog or digital master.</text>
</svg>
