<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Vinyl remained present in thousands of cataloged versions</title>
<desc id="desc">Three aligned line charts show annual Vinyl release-version counts for House, Techno, and Ambient from 2015 through 2024.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#252525}.title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#555}.label{font-size:17px}.small{font-size:14px;fill:#666}.style{font-size:21px;font-weight:700}.grid{stroke:#ddd9d0;stroke-width:1}.axis{stroke:#918d84;stroke-width:1.5}.noteBox{fill:#fff8dc;stroke:#d6bc55;stroke-width:1.5}</style>
<text x="70" y="58" class="title" style="font-size:28px">Vinyl remained present in thousands of cataloged versions</text>
<text x="70" y="91" class="subtitle">Distinct Vinyl-tagged Discogs release versions, 2015–2024</text>
